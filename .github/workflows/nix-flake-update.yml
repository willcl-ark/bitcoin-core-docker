name: nix-flake-update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # Pushing with a PAT (not GITHUB_TOKEN) lets the branch push trigger
      # nix-master.yml, so the update PR gets a test build.
      - name: Update nixpkgs and open PR
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          path-to-flake-dir: master
          inputs: nixpkgs
          commit-msg: "master: update nixpkgs"
          pr-title: "master: update nixpkgs"
